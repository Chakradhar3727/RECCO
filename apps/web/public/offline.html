<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RECCO — Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Inter, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F5F5F5;
            color: #1A2F4B;
            padding: 2rem;
        }
        .container { text-align: center; max-width: 400px; }
        .icon {
            width: 64px; height: 64px;
            margin: 0 auto 1.5rem;
            border-radius: 1rem;
            background: #E8F5ED;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
        }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #1B6B35; }
        p { color: #1A2F4B99; line-height: 1.6; margin-bottom: 1.5rem; }
        button {
            background: #1B6B35; color: white;
            border: none; padding: 0.75rem 2rem;
            border-radius: 0.75rem; font-weight: 600;
            cursor: pointer; font-size: 1rem;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>RECCO needs an internet connection to sync your collections and verify transactions. Please reconnect and try again.</p>
        <button onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
